<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Workshop 3D</title>
<style>
  :root { --bg: #f4f4f2; --panel: #ffffff; --line: #d0d0cc; --ink: #222; --accent: #1a73e8; --hover: #eef2f8; --top: 46px; --status: 44px; --rail: 72px; --side: 300px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; color: var(--ink); background: var(--bg); overflow: hidden; }
  #app { position: fixed; top: var(--top); bottom: var(--status); left: var(--rail); right: var(--side); background: linear-gradient(#9ec4ee 0%, #dbe9f7 45%, #eef0ea 55%, #c9ccc2 100%); }
  #app canvas { display: block; width: 100%; height: 100%; }
  #toolbar { position: fixed; top: var(--top); bottom: var(--status); left: 0; width: var(--rail); display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--panel); border-right: 1px solid var(--line); padding: 8px 4px; overflow: auto; }
  #toolbar button { all: unset; cursor: pointer; width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 6px; position: relative; text-align: center; }
  svg.ico { width: 20px; height: 20px; flex: none; }
  #toolbar .lbl { font-size: 10.5px; line-height: 1.15; }
  #toolbar button.mode { min-height: 44px; opacity: .85; }
  #toolbar button:hover { background: var(--hover); }
  #toolbar button.on { background: #dbe8fd; outline: 1px solid var(--accent); }
  #toolbar button:focus-visible { outline: 2px solid var(--accent); }
  #toolbar button small { position: absolute; right: 3px; bottom: 1px; font-size: 9px; opacity: .6; }
  #toolbar .ressort { flex: 1; }
  #toolbar hr { width: 100%; border: 0; border-top: 1px solid var(--line); margin: 2px 0; }
  #status > span:last-child { flex: none; display: flex; align-items: center; white-space: nowrap; }
  @media (max-width: 1050px) { :root { --side: 270px; } #topbar .txt, #viewbar .txt { display: none; } #topbar .etapes button { padding: 5px 9px; } }
  @media (max-height: 660px) { #toolbar .lbl { display: none; } #toolbar button { min-height: 38px; } #toolbar button.mode { min-height: 38px; } }
  #status { position: fixed; left: 0; right: 0; bottom: 0; height: var(--status); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 12px; background: var(--panel); border-top: 1px solid var(--line); }
  #help { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--ink); opacity: .8; line-height: 1.35; }
  #hud { min-width: 190px; text-align: right; font-variant-numeric: tabular-nums; }
  #hud b { display: inline-block; min-width: 110px; padding: 1px 6px; background: #fff; border: 1px solid var(--line); border-radius: 4px; }
  #unit { all: unset; cursor: pointer; padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; margin-left: 8px; }

  #panel { position: fixed; top: var(--top); bottom: var(--status); right: 0; width: var(--side); overflow: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  #panel h3 { margin: 6px 0 0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; opacity: .65; }
  #panel h3:first-child { margin-top: 0; }
  .row { display: flex; gap: 5px; flex-wrap: wrap; }
  .row .btn { flex: 1 1 auto; }
  ol.guide { padding: 0; margin: 12px 0; list-style: none; counter-reset: g; display: flex; flex-direction: column; gap: 10px; }
  ol.guide li { display: flex; gap: 12px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  ol.guide li p { margin: 4px 0 0; opacity: .8; }
  ol.guide li.fait { opacity: .6; }
  ol.guide li .btn { flex: none; }
  #debit .note { opacity: .7; font-size: 12px; }
  #panel label { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 6px; }
  #panel input, #panel select, #debit input, #debit select { width: 100%; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; min-width: 0; }
  button.btn { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button.btn:hover { background: #eef2f8; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dims { font-variant-numeric: tabular-nums; opacity: .85; }
  .mat-titre { font-size: 12px; }
  .puces, .ajout-mat { display: flex; flex-wrap: wrap; gap: 4px; }
  .ajout-mat { padding: 8px 12px; align-items: center; border-bottom: 1px solid var(--line); }
  button.puce { display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 12px; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px 3px 4px; cursor: pointer; }
  button.puce:hover { background: #eef2f8; }
  button.puce.on { border-color: var(--accent); background: #dbe8fd; }
  button.puce:focus-visible { outline: 2px solid var(--accent); }
  .pastille { width: 14px; height: 14px; border-radius: 50%; border: 1px solid #0003; flex: none; display: inline-block; }
  .repere { font: 600 11px system-ui, sans-serif; background: #1a73e8; color: #fff; border-radius: 4px; padding: 1px 5px; pointer-events: none; }
  .badge { font-size: 11px; border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
  .badge.erreur { background: #fde2df; color: #a1271b; } .badge.attention { background: #fff1cc; color: #7a5700; }
  .formulaire { display: flex; flex-direction: column; gap: 8px; padding: 12px; max-width: 520px; }
  .formulaire label { display: grid; grid-template-columns: 200px 1fr; align-items: center; gap: 8px; }
  .fiche-percage { padding: 8px 12px; break-inside: avoid; }
  .percage-grille { display: grid; grid-template-columns: minmax(180px, 280px) 1fr; gap: 16px; align-items: start; }
  svg.percage { width: 100%; height: auto; } svg.percage .pan { fill: #f3efe6; stroke: #555; stroke-width: 2; }
  svg.percage .cuv { fill: none; stroke: #1a73e8; stroke-width: 2; } svg.percage .tr { fill: #222; } svg.percage text { fill: currentColor; }
  ol.notice { padding-left: 28px; } ol.notice li { margin: 0 0 14px; } ol.notice .titre { font-weight: 600; flex: 1 1 260px; }
  ol.notice textarea { width: 100%; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 5px; margin-top: 5px; }
  @media print { ol.notice input, ol.notice textarea { border: 0; resize: none; } }
  #panel .cotes p { margin: 0 0 6px; font-size: 11.5px; line-height: 1.4; opacity: .85; }
  .matiere-cell { display: flex; align-items: center; gap: 4px; }
  #debit input.couleur { width: 36px; height: 24px; padding: 0; border: 1px solid var(--line); cursor: pointer; }
  #debit { position: fixed; inset: 0; background: #0006; display: none; place-items: center; padding: 24px; }
  #debit.open { display: grid; }
  #debit .sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: min(1100px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  #debit header { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  #debit header h2 { margin: 0 auto 0 0; font-size: 15px; }
  #debit .scroll { overflow: auto; padding: 0 14px; }
  #debit table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  #debit th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; opacity: .7; padding: 8px 4px; position: sticky; top: 0; background: var(--panel); }
  #debit td { padding: 2px; border-top: 1px solid var(--line); }
  #debit td input { width: 100%; }
  #debit td input.num { width: 72px; text-align: right; }
  #debit td.src { font-size: 11px; opacity: .6; white-space: nowrap; padding: 0 6px; }
  #debit footer { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 18px; font-variant-numeric: tabular-nums; }
  #debit footer .note { flex-basis: 100%; opacity: .6; font-size: 12px; }
  #panel input[type=checkbox] { width: auto; justify-self: start; }
  #debit h3 { margin: 16px 0 6px; font-size: 13px; }
  #debit .multi th { position: static; }
  #debit .warn { color: #d33a2c; }
  #debit .cout { display: flex; flex-wrap: wrap; gap: 6px 22px; padding: 10px 0; font-variant-numeric: tabular-nums; }
  #debit .cout b { font-size: 15px; }
  #debit .form { display: grid; grid-template-columns: fit-content(65%) 200px; gap: 8px 12px; align-items: center; padding: 14px 0; }
  .plan { width: 100%; max-width: 760px; display: block; margin: 4px 0 14px; }
  .plan .pan { fill: #8881; stroke: currentColor; stroke-width: 5; }
  .plan .pc { fill: #e9d6ab; stroke: #1b1b1b; stroke-width: 3; }
  .plan text { fill: #1b1b1b; font-family: system-ui, sans-serif; }
  #debit .propose { border-left: 3px solid var(--accent); padding: 6px 10px; background: #1a73e812; border-radius: 4px; }
  #debit .pantitre { margin-top: 10px; font-weight: 600; }
  #debit table.legende { width: auto; margin: 0 0 12px; font-size: 12px; }
  #debit table.legende td { border: 0; padding: 1px 10px 1px 0; }
  #assistant { position: fixed; right: calc(var(--side) + 14px); bottom: calc(var(--status) + 10px); width: 380px; height: min(640px, calc(100% - 68px)); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 2px 12px #0003; display: none; flex-direction: column; overflow: hidden; z-index: 3; }
  #assistant.open { display: flex; }
  #assistant header { display: flex; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  #assistant header .vide { flex: 1; }
  #assistant header .btn { padding: 3px 8px; }
  #assistant .fil { flex: 1; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  #assistant .msg { white-space: pre-wrap; line-height: 1.4; overflow-wrap: anywhere; }
  #assistant .msg p { margin: 0 0 6px; }
  #assistant .msg.moi { align-self: flex-end; max-width: 85%; background: #dbe8fd; border-radius: 10px 10px 2px 10px; padding: 6px 10px; }
  #assistant .msg.outil { font-size: 11.5px; opacity: .65; }
  #assistant .msg.outil.rate, #assistant .msg.erreur { color: #c5221f; opacity: 1; }
  #assistant .msg.systeme { font-size: 12px; opacity: .8; border-left: 3px solid var(--accent); padding: 4px 8px; display: flex; flex-direction: column; gap: 6px; }
  #assistant .msg.systeme input { flex: 1; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; }
  #assistant .saisie { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); align-items: flex-end; }
  #assistant textarea { flex: 1; resize: none; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
  #btn-assistant { all: unset; cursor: pointer; padding: 0 8px; border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; margin-right: 10px; }
  #btn-assistant.on { background: var(--accent); color: #fff; }

  #topbar { position: fixed; top: 0; left: 0; right: 0; height: var(--top); display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 4; }
  #topbar .marque { white-space: nowrap; display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
  #topbar .marque svg.ico { color: var(--accent); }
  #topbar .projet { display: flex; align-items: center; gap: 6px; padding-left: 10px; border-left: 1px solid var(--line); min-width: 0; }
  #topbar .projet b { font-weight: 500; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #topbar .pastille-etat { width: 8px; height: 8px; border-radius: 50%; background: #e08a00; flex: none; }
  #topbar .etapes { display: flex; gap: 2px; margin: 0 auto; background: var(--bg); border-radius: 9px; padding: 3px; }
  #topbar .etapes button { font: inherit; color: inherit; background: transparent; border: 1px solid transparent; border-radius: 7px; padding: 5px 12px; cursor: pointer; display: flex; gap: 6px; align-items: baseline; opacity: .75; }
  #topbar .etapes button:hover { opacity: 1; }
  #topbar .etapes button.on { background: var(--panel); border-color: var(--line); font-weight: 500; opacity: 1; }
  #topbar .etapes button .n { color: var(--accent); font-variant-numeric: tabular-nums; }
  #topbar .icone-btn { font: inherit; color: inherit; background: transparent; border: 1px solid transparent; border-radius: 7px; padding: 6px 8px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  #topbar .icone-btn:hover { background: var(--hover); }
  #menu-plus { position: fixed; top: calc(var(--top) - 4px); right: 10px; min-width: 200px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; box-shadow: 0 6px 20px #0003; display: none; z-index: 5; }
  #menu-plus.open { display: block; }
  #menu-plus button { font: inherit; color: inherit; background: transparent; border: 0; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  #menu-plus button:hover { background: var(--hover); }
  #viewbar { position: fixed; bottom: calc(var(--status) + 10px); left: var(--rail); right: var(--side); display: flex; justify-content: center; pointer-events: none; z-index: 3; }
  #viewbar .barre { pointer-events: auto; display: flex; gap: 2px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; box-shadow: 0 2px 10px #0002; white-space: nowrap; }
  #viewbar button { font: inherit; color: inherit; background: transparent; border: 0; border-radius: 7px; padding: 5px 10px; cursor: pointer; display: flex; gap: 5px; align-items: center; }
  #viewbar button:hover { background: var(--hover); }
  #viewbar button.on { background: #dbe8fd; color: #174ea6; }
  #viewbar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 3px 4px; }
  .carte { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .conseil { margin: 0; padding: 10px; border-radius: 10px; background: var(--bg); line-height: 1.4; }
  .etape-titre { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; opacity: .65; margin: 2px 0 -2px; }
  button.action { font: inherit; color: inherit; text-align: left; width: 100%; display: flex; gap: 10px; align-items: center; background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; cursor: pointer; }
  button.action:hover { background: var(--hover); }
  button.action.primaire { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  button.action.primaire:hover { opacity: .9; }
  button.action .t { font-weight: 500; }
  button.action .d { font-size: 12px; opacity: .7; margin-top: 1px; }
  button.action svg.ico { width: 22px; height: 22px; }
  .selbox { position: absolute; display: none; pointer-events: none; border: 1px solid #1a73e8; background: #1a73e81a; z-index: 2; }
  .cote { background: #1a73e8; color: #fff; font: 600 12px system-ui, sans-serif; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
  @media print { body > *:not(#debit) { display: none !important; } #debit { position: static; background: none; display: block !important; padding: 0; } #debit .sheet { border: 0; width: 100%; } #debit header button, #debit td button, #debit .col-act { display: none !important; } #debit input, #debit select { border: 0; appearance: none; } }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1f22; --panel: #2b2d30; --line: #43454a; --ink: #e6e6e6; } #toolbar button:hover, #viewbar button:hover, #topbar .icone-btn:hover, #topbar .etapes button:hover, #menu-plus button:hover, button.action:hover { background: #3a3d42; } :root { --hover: #3a3d42; } #viewbar button.on { background: #27406b; color: #cfe0ff; } .conseil { background: #1e1f22; } button.action.primaire { background: #e6e6e6; color: #1e1f22; } #toolbar button.on { background: #27406b; } #hud b { background: #1e1f22; } #assistant .msg.moi { background: #27406b; } button.puce:hover { background: #3a3d42; } button.puce.on { background: #27406b; } button.btn:hover { background: #3a3d42; } .badge.erreur { background: #5c1e19; color: #ffb4ab; } .badge.attention { background: #4d3b00; color: #ffd970; } svg.percage .pan { fill: #34363a; stroke: #aaa; } }
</style>
</head>
<body>
<div id="topbar"></div>
<div id="menu-plus"></div>
<div id="app"></div>
<div id="viewbar"></div>
<div id="toolbar"></div>
<div id="panel"></div>
<div id="debit"></div>
<div id="assistant"></div>
<div id="status"><span id="help"></span><span><button id="btn-assistant" title="Assistant Claude intégré">✦ Assistant</button><span id="hud"></span></span></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
